name: Sync indexer

on:
  schedule:
    # Every 5 minutes — workaround for Vercel Hobby plan daily-cron limit.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger sync
        run: |
          curl -sf --max-time 90 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.antfeed.org/api/cron/sync
