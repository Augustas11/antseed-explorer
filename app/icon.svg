<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="14" fill="#eef0f3"/>

  <!-- Isometric cube outline -->
  <g stroke="#c8ccd6" stroke-width="1.2" fill="none" stroke-linejoin="round">
    <polygon points="50,12 82,30 82,66 50,84 18,66 18,30"/>
    <line x1="50" y1="12" x2="50" y2="48"/>
    <line x1="18" y1="30" x2="50" y2="48"/>
    <line x1="82" y1="30" x2="50" y2="48"/>
  </g>

  <!-- Left antenna -->
  <line x1="46" y1="22" x2="32" y2="10" stroke="#2c3040" stroke-width="2" stroke-linecap="round"/>
  <circle cx="30" cy="8"  r="3.2" fill="#2c3040"/>

  <!-- Right antenna -->
  <line x1="54" y1="22" x2="68" y2="10" stroke="#2c3040" stroke-width="2" stroke-linecap="round"/>
  <circle cx="70" cy="8"  r="3.2" fill="#2c3040"/>

  <!-- Head -->
  <ellipse cx="50" cy="28" rx="10" ry="10" fill="#2c3040"/>

  <!-- Thorax -->
  <ellipse cx="50" cy="42" rx="6.5" ry="7.5" fill="#2c3040"/>

  <!-- Upper-left leg -->
  <line x1="43.5" y1="37" x2="22" y2="28" stroke="#2c3040" stroke-width="2" stroke-linecap="round"/>
  <circle cx="19" cy="26.5" r="3.2" fill="#2c3040"/>

  <!-- Mid-left leg -->
  <line x1="43.5" y1="42" x2="18" y2="44" stroke="#2c3040" stroke-width="2" stroke-linecap="round"/>
  <circle cx="15" cy="44" r="3.2" fill="#2c3040"/>

  <!-- Lower-left leg -->
  <line x1="43.5" y1="47" x2="22" y2="59" stroke="#2c3040" stroke-width="2" stroke-linecap="round"/>
  <circle cx="19.5" cy="61" r="3.2" fill="#2c3040"/>

  <!-- Upper-right leg -->
  <line x1="56.5" y1="37" x2="78" y2="28" stroke="#2c3040" stroke-width="2" stroke-linecap="round"/>
  <circle cx="81" cy="26.5" r="3.2" fill="#2c3040"/>

  <!-- Mid-right leg -->
  <line x1="56.5" y1="42" x2="82" y2="44" stroke="#2c3040" stroke-width="2" stroke-linecap="round"/>
  <circle cx="85" cy="44" r="3.2" fill="#2c3040"/>

  <!-- Lower-right leg -->
  <line x1="56.5" y1="47" x2="78" y2="59" stroke="#2c3040" stroke-width="2" stroke-linecap="round"/>
  <circle cx="80.5" cy="61" r="3.2" fill="#2c3040"/>

  <!-- Abdomen -->
  <ellipse cx="50" cy="64" rx="11" ry="15" fill="#2c3040"/>
</svg>
